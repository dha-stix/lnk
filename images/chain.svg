<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <style>
    g { transform-origin: 40px 40px; animation: wiggle 2s ease-in-out infinite; }
    @keyframes wiggle { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) { g { animation: none; } }
  </style>
  <g>
    <rect x="6" y="28" width="38" height="24" rx="12" fill="none" stroke="#5B3DF5" stroke-width="6"/>
    <rect x="36" y="28" width="38" height="24" rx="12" fill="none" stroke="#121212" stroke-width="6"/>
  </g>
</svg>
