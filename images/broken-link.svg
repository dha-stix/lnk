<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70">
  <style>
    .l { transform-origin: 70px 35px; animation: swingL 2.2s ease-in-out infinite; }
    .r { transform-origin: 90px 35px; animation: swingR 2.2s ease-in-out infinite; }
    @keyframes swingL { 0%, 100% { transform: rotate(-8deg) translateX(-4px); } 50% { transform: rotate(-18deg) translateX(-10px); } }
    @keyframes swingR { 0%, 100% { transform: rotate(8deg) translateX(4px); } 50% { transform: rotate(18deg) translateX(10px); } }
    @media (prefers-reduced-motion: reduce) { .l, .r { animation: none; } }
  </style>
  <g class="l"><rect x="10" y="20" width="60" height="30" rx="15" fill="none" stroke="#5B3DF5" stroke-width="7"/></g>
  <g class="r"><rect x="90" y="20" width="60" height="30" rx="15" fill="none" stroke="#121212" stroke-width="7"/></g>
  <path d="M80 8 v10 M72 12 l4 6 M88 12 l-4 6" stroke="#FF8A5B" stroke-width="3" stroke-linecap="round"/>
</svg>
